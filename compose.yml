version: "3.9"
services:
  worker-000:
    build:
      context: ./worker
    restart: "always"
    ports:
      - "${WORKER_000_PORT}:${WORKER_000_PORT}"
    environment:
      HEALTH_CHECK_DELAY_MS: ${HEALTH_CHECK_DELAY_MS_WORKER_000}
      WORKER_NUMBER: '000'
      PORT: ${WORKER_000_PORT}
  worker-001:
    build:
      context: ./worker
