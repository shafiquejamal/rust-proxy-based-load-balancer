      HEALTH_CHECK_DELAY_MS: ${HEALTH_CHECK_DELAY_MS_WORKER_001}
      WORKER_NUMBER: '001'
      PORT: ${WORKER_001_PORT}
  worker-002:
    build:
      context: ./worker
    restart: "always"
